# XcodeGen spec -- the .xcodeproj is generated, not committed (scripts/generate-project.sh).
name: Marvin
options:
  bundleIdPrefix: com.gileskayo
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    # Filled in by scripts/generate-project.sh from $DEVELOPMENT_TEAM or the gitignored Apps/Marvin/.team,
    # so regenerating never loses signing and no personal team ID is committed.
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
packages:
  MarvinCore:
    path: ../../Packages/MarvinCore
targets:
  Marvin:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: MarvinCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gileskayo.marvin
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only (PRD #152 out of scope: iPad)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "MARVIN"   # ADR: installed display name is just "MARVIN"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        # The backend is plain HTTP on a Tailscale address (ADR 0042); the tunnel is the encryption,
        # so App Transport Security needs an exception. Merged with the generated keys.
        INFOPLIST_FILE: Info/Info.plist
schemes:
  Marvin:
    build:
      targets:
        Marvin: all
